<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discover — Heartline</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="container nav">
      <a href="/" class="logo">Heart<span>line</span></a>
      <div class="nav-links">
        <a href="/#how">How it works</a>
        <a href="discover.html" class="active">Discover</a>
        <a href="/#join" class="btn btn-primary">Join free</a>
      </div>
    </nav>
  </header>

  <main class="container discover">
    <div>
      <div class="deck" id="deck" aria-live="polite"></div>
      <div class="actions">
        <button class="round pass" id="pass-btn" aria-label="Pass">✕</button>
        <button class="round like" id="like-btn" aria-label="Like">♥</button>
      </div>
      <p class="hint">Tip: use the ← and → arrow keys</p>
    </div>

    <aside>
      <div class="panel">
        <h3>Your matches</h3>
        <ul class="match-list" id="match-list"></ul>
        <p class="empty-note" id="no-matches">No matches yet. Keep liking!</p>
      </div>
      <div class="panel">
        <h3>Liked</h3>
        <p class="empty-note" id="like-count">0 profiles liked</p>
        <button class="btn btn-ghost" id="reset-btn" style="margin-top:12px">Start over</button>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
