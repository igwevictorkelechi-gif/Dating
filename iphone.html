<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>alignment on iPhone</title>
    <meta name="description" content="Try the alignment app inside an iPhone 15 Pro frame." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* iPhone 15 Pro frame around the real app. On a phone-sized screen the frame drops away. */
      html, body { height: 100%; }
      body { margin: 0; overflow: hidden; }
      .stage {
        position: relative;
        height: 100%;
        background:
          radial-gradient(1200px 600px at 50% 20%, var(--green-tint), transparent 70%),
          var(--backdrop);
        font-family: var(--font);
      }
      .rig { position: absolute; top: 50%; left: 50%; display: grid; justify-items: center; gap: 18px; transform-origin: center; transform: translate(-50%, -50%); }
      .iphone {
        position: relative;
        width: 393px;
        height: 852px;
        padding: 12px;
        box-sizing: content-box;
        border-radius: 68px;
        background: linear-gradient(145deg, #4a4a4f, #1c1c1e 45%, #3a3a3e);
        box-shadow:
          0 0 0 2px #6b6b70,
          0 0 0 3px #1a1a1c,
          0 40px 80px rgba(0, 0, 0, 0.35);
      }
      .btn-side { position: absolute; width: 4px; background: #3a3a3e; border-radius: 2px; }
      .btn-action { left: -5px; top: 150px; height: 34px; }
      .btn-vol-up { left: -5px; top: 215px; height: 62px; }
      .btn-vol-down { left: -5px; top: 290px; height: 62px; }
      .btn-power { right: -5px; top: 250px; height: 100px; }
      .display {
        position: relative;
        width: 393px;
        height: 852px;
        border-radius: 56px;
        overflow: hidden;
        background: var(--bg);
        display: flex;
        flex-direction: column;
      }
      .status {
        flex: 0 0 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 34px 0 52px;
        font: 600 17px/1 -apple-system, 'SF Pro Text', system-ui, sans-serif;
        color: var(--ink);
        background: var(--bg);
        position: relative;
        z-index: 60;
      }
      .status .icons { display: flex; align-items: center; gap: 6px; }
      .island {
        position: absolute;
        top: 11px;
        left: 50%;
        transform: translateX(-50%);
        width: 126px;
        height: 37px;
        border-radius: 20px;
        background: #000;
        z-index: 70;
      }
      .viewport { position: relative; flex: 1; min-height: 0; --safe-bottom: 22px; } /* room for the home indicator */
      .viewport #root { height: 100%; }
      .viewport .app { max-width: none; box-shadow: none; }
      .home-bar {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 134px;
        height: 5px;
        border-radius: 3px;
        background: var(--ink);
        opacity: 0.85;
        z-index: 70;
        pointer-events: none;
      }
      .caption { display: flex; align-items: center; gap: 14px; color: var(--ink-2); font-size: 13px; }
      .caption button {
        font: inherit; font-weight: 600; color: var(--green);
        background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
      }

      @media (max-width: 500px) {
        .stage { background: var(--bg); }
        .rig { position: static; height: 100%; transform: none !important; gap: 0; }
        .iphone { width: 100%; height: 100%; padding: 0; border-radius: 0; background: none; box-shadow: none; }
        .btn-side, .island, .status, .home-bar, .caption { display: none; }
        .display { width: 100%; height: 100%; border-radius: 0; }
        .viewport { --safe-bottom: env(safe-area-inset-bottom, 0px); }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="rig" id="rig">
        <div class="iphone" aria-label="iPhone 15 Pro">
          <span class="btn-side btn-action"></span>
          <span class="btn-side btn-vol-up"></span>
          <span class="btn-side btn-vol-down"></span>
          <span class="btn-side btn-power"></span>
          <div class="display">
            <div class="island" aria-hidden="true"></div>
            <div class="status" aria-hidden="true">
              <span id="clock">9:41</span>
              <span class="icons">
                <svg width="19" height="12" viewBox="0 0 19 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
                <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5l1.2-1.2A10.6 10.6 0 0 0 8.5.6 10.6 10.6 0 0 0 1 3.6l1.2 1.2a9 9 0 0 1 6.3-2.5Zm0 3.4c1.5 0 2.9.6 4 1.6l1.2-1.2a7.3 7.3 0 0 0-10.4 0l1.2 1.2a5.6 5.6 0 0 1 4-1.6Zm0 3.3c-.7 0-1.3.3-1.8.7l1.8 1.8 1.8-1.8c-.5-.4-1.1-.7-1.8-.7Z"/></svg>
                <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="currentColor" opacity="0.5"/></svg>
              </span>
            </div>
            <div class="viewport"><div id="root"></div></div>
            <div class="home-bar" aria-hidden="true"></div>
          </div>
        </div>
        <div class="caption">
          <span>alignment · iPhone 15 Pro</span>
          <button type="button" id="reset">Reset demo</button>
        </div>
      </div>
    </div>
    <script>
      // Fit the phone to the window, and keep the status-bar clock current.
      (function () {
        var rig = document.getElementById('rig');
        function fit() {
          if (window.innerWidth <= 500) { rig.style.transform = 'none'; return; }
          var s = Math.min(1, (window.innerHeight - 24) / 926, (window.innerWidth - 32) / 425);
          rig.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
        }
        fit();
        window.addEventListener('resize', fit);

        var clock = document.getElementById('clock');
        function tick() {
          var d = new Date();
          clock.textContent = d.getHours() % 12 || 12;
          clock.textContent += ':' + String(d.getMinutes()).padStart(2, '0');
        }
        tick();
        setInterval(tick, 10000);

        document.getElementById('reset').addEventListener('click', function () {
          try { localStorage.removeItem('alignment:v1'); } catch (e) { /* storage blocked */ }
          location.hash = '#/';
          location.reload();
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
